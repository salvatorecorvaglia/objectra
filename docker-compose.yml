services:
  stiva:
    build: .
    container_name: stiva
    ports:
      - "${STIVA_S3_PORT:-9000}:${STIVA_S3_PORT:-9000}"   # S3 API
      - "${STIVA_CONSOLE_PORT:-9001}:${STIVA_CONSOLE_PORT:-9001}"   # Web Console
    volumes:
      - ./data:/data
    environment:
      - STIVA_ACCESS_KEY=${STIVA_ACCESS_KEY:-stiva}
      - STIVA_SECRET_KEY=${STIVA_SECRET_KEY:-stiva123}
      - STIVA_DATA_DIR=${STIVA_DATA_DIR:-/data}
      - STIVA_REGION=${STIVA_REGION:-us-east-1}
    restart: unless-stopped

