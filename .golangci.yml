# ================================================================
# golangci-lint configuration for Stiva
# ================================================================

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert

linters-settings:
  gosec:
    excludes:
      # MD5 is required by S3 ETag and SSE-C key-MD5 specs.
      - G401
      - G501
      - G115
  revive:
    rules:
      - name: exported
        disabled: true
      - name: var-naming
        disabled: true
      - name: increment-decrement
        disabled: true
  errcheck:
    exclude-functions:
      - (*os.File).Close
      - (io.Closer).Close
      - os.Remove
      - os.RemoveAll
      - (*go.etcd.io/bbolt.DB).Close
      - (net.Listener).Close
      - (*net.TCPListener).Close

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - ineffassign
        - gosec
        - noctx
